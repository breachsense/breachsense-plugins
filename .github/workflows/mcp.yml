name: MCP server

on:
  pull_request:
    paths: ["mcp/**", "plugins/breachsense/mcp/**", ".github/workflows/mcp.yml"]
  push:
    tags: ["mcp-v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run smoke
      - run: npm run smoke:pack
      - name: Committed plugin bundle matches the source
        run: git diff --exit-code ../plugins/breachsense/mcp/server.mjs

  # No npm token anywhere: trusted publishing (OIDC). npm trusts only this repo + this workflow file (mcp.yml,
  # matched case-sensitively), provenance is generated automatically, and the job only STAGES the version.
  # It goes live when a maintainer approves it with 2FA on npmjs.com (Staged Packages tab).
  # No job in this workflow uses a repository secret, so fork PRs cannot reach any key.
  release:
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    needs: check
    runs-on: ubuntu-latest   # trusted publishing requires GitHub-hosted runners
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # OIDC for npm trusted publishing (and provenance)
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # trusted publishing needs Node >= 22.14.0; no dependency cache in release builds
          registry-url: https://registry.npmjs.org
      - name: npm with staged publishing (>= 11.15.0)
        run: npm install -g npm@^11.15.0 && npm --version
      - run: npm ci
      - name: Tag matches package.json version
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "mcp-v$v" != "$GITHUB_REF_NAME" ]; then echo "tag $GITHUB_REF_NAME does not match package version $v"; exit 1; fi
      - name: Trusted publishing preflight (clear error instead of ENEEDAUTH)
        run: |
          want="git+https://github.com/$GITHUB_REPOSITORY.git"
          got=$(node -p "require('./package.json').repository.url")
          if [ "$got" != "$want" ]; then echo "package.json repository.url is $got, npm trusted publishing needs $want"; exit 1; fi
          wf="${GITHUB_WORKFLOW_REF%%@*}"; wf="${wf##*/}"
          if [ "$wf" != "mcp.yml" ]; then echo "running from workflow $wf; the npm trusted publisher is configured for mcp.yml"; exit 1; fi
      - run: npm run build
      - run: npm run smoke:pack
      - name: Stage on npm (approve with 2FA on npmjs.com to publish)
        run: npm stage publish
      - name: Pack the Claude Desktop extension
        run: npx -y @anthropic-ai/mcpb@2.1.2 pack dist-mcpb breachsense.mcpb
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#mcp-v}"
          gh release create "$GITHUB_REF_NAME" breachsense.mcpb dist/sbom.cdx.json \
            --title "Breachsense MCP $v" \
            --notes "Run it from any MCP client: \`npx -y @breachsense/mcp@$v\` (the npm version goes live once a maintainer approves the staged release). Claude Desktop: download breachsense.mcpb and open it. SBOM of everything bundled: sbom.cdx.json (CycloneDX 1.5). Setup for each AI tool: https://github.com/breachsense/breachsense-plugins/tree/main/mcp#readme"
