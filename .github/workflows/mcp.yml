name: MCP server

on:
  pull_request:
    paths: ["mcp/**", "plugins/breachsense/mcp/**", ".github/workflows/mcp.yml"]
  push:
    tags: ["mcp-v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run smoke
      - run: npm run smoke:pack
      - name: Committed plugin bundle matches the source
        run: git diff --exit-code ../plugins/breachsense/mcp/server.mjs

  release:
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # npm provenance
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package.json version
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "mcp-v$v" != "$GITHUB_REF_NAME" ]; then echo "tag $GITHUB_REF_NAME does not match package version $v"; exit 1; fi
      - run: npm run build
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Pack the Claude Desktop extension
        run: npx -y @anthropic-ai/mcpb@2.1.2 pack dist-mcpb breachsense.mcpb
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#mcp-v}"
          gh release create "$GITHUB_REF_NAME" breachsense.mcpb \
            --title "Breachsense MCP $v" \
            --notes "Run it from any MCP client: \`npx -y @breachsense/mcp@$v\`. Claude Desktop: download breachsense.mcpb and open it. Setup for each AI tool: https://github.com/breachsense/breachsense-plugins/tree/main/mcp#readme"
